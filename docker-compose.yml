# Docker Compose para Next.js + PostgreSQL
name: openmonetis

# Tudo local: a imagem do app é construída a partir deste repositório e o
# PostgreSQL roda em container. Nenhuma imagem de terceiros além das oficiais
# node:22-alpine e postgres:18-alpine.
#
# USO:
# 1. Subir (constrói a imagem na primeira vez): docker compose up --build -d
# 2. Ver logs:                                   docker compose logs -f app
# 3. Parar:                                      docker compose down
# 4. Apagar TAMBÉM os dados do banco (CUIDADO):  docker compose down -v

services:
  # ============================================
  # Serviço: PostgreSQL (Banco de dados local)
  # ============================================
  db:
    image: postgres:18-alpine
    container_name: openmonetis_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmonetis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-openmonetis_db}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"

    ports:
      # Exposto apenas para a própria máquina (não acessível pela rede)
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Cria extensão pgcrypto inline (necessária para gen_random_bytes no schema)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'CREATE EXTENSION IF NOT EXISTS pgcrypto;' > /docker-entrypoint-initdb.d/init.sql
        exec docker-entrypoint.sh postgres

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-openmonetis} -d ${POSTGRES_DB:-openmonetis_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Para ativar logs de queries (debug), adicione ao command acima:
    # exec docker-entrypoint.sh postgres -c log_statement=all

  # ============================================
  # Serviço: Aplicação Next.js
  # ============================================
  app:
    # Build a partir do código deste repositório (nunca usar imagem de terceiros)
    build:
      context: .
      dockerfile: Dockerfile
    image: openmonetis-local:latest

    container_name: openmonetis_app
    restart: unless-stopped

    ports:
      - "${APP_PORT:-3000}:3000"

    environment:
      NODE_ENV: production

      # Conecta no container "db" pela rede interna do Docker.
      # O DATABASE_URL do .env (localhost) é só para ferramentas fora do Docker.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmonetis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openmonetis_db}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}

      # Email (opcional)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}

      # OAuth (opcional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # AI providers (opcional)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

    # Só depende do 'db' se estiver usando banco local
    # Para banco remoto, comente as linhas abaixo
    depends_on:
      db:
        condition: service_healthy

    # Script de inicialização: roda migrations antes de iniciar o app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Aguardando banco de dados..."
        sleep 5

        echo "Rodando migrations..."
        ./node_modules/.bin/drizzle-kit push || echo "Migrations falharam ou já estão atualizadas"

        echo "Iniciando aplicação Next.js..."
        node server.js

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
